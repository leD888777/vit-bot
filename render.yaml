services:
  - type: pserv
    name: vet-postgres
    env: docker
    image:
      url: postgres:15-alpine
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: n8n
      - key: POSTGRES_USER
        value: n8n
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  - type: web
    name: vet-n8n
    env: docker
    image:
      url: n8nio/n8n:latest
    plan: free
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromService:
          name: vet-postgres
          type: pserv
          property: host
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_DATABASE
        value: n8n
      - key: DB_POSTGRESDB_USER
        value: n8n
      - key: DB_POSTGRESDB_PASSWORD
        fromService:
          name: vet-postgres
          type: pserv
          property: password
      - key: WEBHOOK_URL
        value: https://vet-n8n.onrender.com
      - key: GENERIC_TIMEZONE
        value: Europe/Moscow
    healthCheckPath: /healthz

  - type: web
    name: vet-evolution
    env: docker
    image:
      url: atendai/evolution-api:latest
    plan: free
    envVars:
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: QRCODE_LIMIT
        value: 30
    healthCheckPath: /
