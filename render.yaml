services:
  - type: web
    name: vet-n8n
    env: docker
    image:
      url: n8nio/n8n:latest
    plan: free
    envVars:
      - key: WEBHOOK_URL
        value: https://vet-n8n.onrender.com
      - key: GENERIC_TIMEZONE
        value: Europe/Moscow
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /healthz
  - type: web
    name: vet-evolution
    env: docker
    image:
      url: atendai/evolution-api:latest
    plan: free
    envVars:
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: QRCODE_LIMIT
        value: 30
    healthCheckPath: /
